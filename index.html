<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <title>CalcNote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <style>
      /* Custom scrollbar for a sleek look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b; 
      }
      
      /* Hide the actual input caret to prevent visual clutter, we rely on the preview */
      .math-input-caret {
        caret-color: #8b5cf6;
      }

      /* Custom Blinking Cursor for Math Render */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      .blinking-cursor {
        display: inline-block;
        width: 2px;
        height: 1.2em;
        background-color: #8b5cf6; /* Indigo-500 */
        vertical-align: middle;
        margin: 0 1px;
        animation: blink 1s step-end infinite;
        border-radius: 1px;
        pointer-events: none; /* Let clicks pass through */
      }
      
      /* Specific fix for cursor inside empty brackets to ensure it has height */
      .katex .blinking-cursor {
        height: 1.2em;
        vertical-align: -0.1em;
      }

      /* Keep the keypad clear of notches / home indicators on mobile */
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
